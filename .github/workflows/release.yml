name: Release

# Publica una version nueva al subir un tag:
#   git tag v1.2.0
#   git push origin v1.2.0
# Genera el instalador y lo sube a GitHub Releases; las copias instaladas
# lo detectan y se actualizan solas.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Las credenciales de la Microsoft Store viven en este Environment
    # (Settings -> Environments -> produccion). Configúralo para que solo
    # acepte tags v* y te pida aprobación: nada se firma ni se envía sin ti.
    environment: produccion
    env:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version desde el tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $enProps = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -ne $enProps) {
            throw "El tag ($version) no coincide con Directory.Build.props ($enProps). Actualiza la version antes de etiquetar."
          }
          "numero=$version" >> $env:GITHUB_OUTPUT

      - name: Restaurar herramientas
        run: dotnet tool restore

      # Las versiones anteriores permiten generar actualizaciones "delta"
      # (solo lo que cambio). En la primera version no hay nada: se ignora.
      - name: Descargar version anterior
        shell: pwsh
        run: |
          dotnet vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir artifacts/releases
          if ($LASTEXITCODE -ne 0) { Write-Host 'Sin version anterior; se publica completa.'; $global:LASTEXITCODE = 0 }

      - name: Pruebas, compilacion e instalador
        shell: pwsh
        run: ./scripts/publicar.ps1 -Version ${{ steps.version.outputs.numero }} -ConservarAnteriores

      - name: Publicar en GitHub Releases
        run: >
          dotnet vpk upload github
          --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --outputDir artifacts/releases
          --tag ${{ github.ref_name }}
          --releaseName "NovaFolder ${{ steps.version.outputs.numero }}"
          --publish

      # ---------- Microsoft Store ----------

      - name: Paquete MSIX para la Store
        shell: pwsh
        run: ./scripts/empaquetar-store.ps1 -Version ${{ steps.version.outputs.numero }}

      # Siempre queda descargable desde la ejecución del workflow, por si
      # prefieres subirlo a mano en Partner Center.
      - name: Guardar el MSIX
        uses: actions/upload-artifact@v7
        with:
          name: NovaFolder-store-${{ steps.version.outputs.numero }}
          path: artifacts/store/*.msix

      # Solo si el Environment tiene las credenciales de la API de la Store.
      # La primera publicación de la app tiene que hacerse a mano en Partner
      # Center (ficha, capturas, clasificación de edad); después, esto envía
      # cada versión nueva automáticamente.
      - name: Preparar Microsoft Store CLI
        if: env.MSSTORE_CLIENT_SECRET != ''
        uses: microsoft/setup-msstore-cli@v1

      - name: Enviar a la Microsoft Store
        if: env.MSSTORE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          $msix = Get-ChildItem artifacts/store/*.msix | Select-Object -First 1
          msstore publish $msix.FullName -id 9P3KG5PCB5HD

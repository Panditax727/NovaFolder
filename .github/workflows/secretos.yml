name: Secretos

# Revisa TODO el historial en cada push y cada Pull Request en busca de
# contraseñas, tokens o claves que se hayan colado. Si encuentra algo, falla.
#
# Se usa el programa oficial de gitleaks en vez de su acción: la acción
# revisa solo el rango del push y falla con los push forzados que incluyen
# el primer commit del repositorio.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # Checksum oficial (gitleaks_8.30.1_checksums.txt): garantiza que el
  # binario descargado es el auténtico.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum --check
          tar -xzf "$archivo" gitleaks

      - name: Revisar el historial completo
        run: ./gitleaks git . --redact --verbose

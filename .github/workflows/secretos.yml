name: Secretos

# Revisa cada push y cada Pull Request (con todo el historial) en busca de
# contraseñas, tokens o claves que se hayan colado. Si encuentra algo, falla.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
